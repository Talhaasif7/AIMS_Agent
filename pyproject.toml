[project]
name = "aims-measurement-agent"
version = "0.1.0"
description = "AIMS Measurement Agent — MCP server for torch_measure psychometrics"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "pydantic>=2.0,<3.0",
    "aiosqlite>=0.20,<1.0",
    "mcp>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.29,<1.0",
    "psycopg2-binary>=2.9,<3.0",
]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
